name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 16:00 UTC (21:00 Uzbekistan time). The job publishes a new static snapshot.
    - cron: '0 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/ui
      - run: npm run build -w apps/preview
      - name: Crawl public candidate sources
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 360
        run: |
          mkdir -p apps/preview/dist/data
          npm run crawl -- \
            --input tools/contact-crawler/sources.json \
            --output apps/preview/dist/data/crawler-snapshot.json \
            --depth 2 --pages 8 --listing-pages 0 --candidates 0 --timeout 8000 --delay 100
      - name: Ensure a snapshot is always published
        run: |
          if [ ! -s apps/preview/dist/data/crawler-snapshot.json ]; then
            mkdir -p apps/preview/dist/data
            printf '%s\n' '{"schemaVersion":3,"generatedAt":"'"$(date -u +%FT%TZ)"'","candidates":[],"discoveryReports":[],"sourceReports":[],"error":"crawler-run-failed","policy":{"publicOnly":true,"llm":false}}' > apps/preview/dist/data/crawler-snapshot.json
          fi
      - name: Add SPA fallback
        run: cp apps/preview/dist/index.html apps/preview/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/preview/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
